# Settings for the participant database container on the Jenkins host. Sourced by lib.sh.
# Per-environment network settings (participant_db_host) live in ../environments/<ENV>.tfvars.

# The server must run this major version. start.sh replaces a container on any other.
PG_MAJOR=16
PG_IMAGE=docker.io/library/postgres:16

DB_NAME=etl_db
DB_USERNAME=hpds_etl
DB_SCHEMA=etl
DB_PORT=5432
MAX_CONNECTIONS=300
SHARED_BUFFERS=1GB

# Dumps: s3://<BACKUP_BUCKET>/<BACKUP_PREFIX>/<ENV>/backups/ (bucket must be versioned).
BACKUP_BUCKET=bdc-etl-data-d0d6191
BACKUP_PREFIX=avillach-73-bdcatalyst-etl/participant-db

# pg_dump / pg_restore parallelism inside the container.
DUMP_JOBS=4

# How long to wait for Postgres to accept connections after (re)creating the container.
READY_TIMEOUT_SECONDS=300

# How long start.sh waits for a stopped (or not yet accepting) container to come back so it can be
# saved before a replace. Crash recovery after a host reboot can take minutes. If it does not come
# back in time, start fails and leaves the volume alone (unless OVERWRITE=true).
RESTART_STOPPED_TIMEOUT_SECONDS=600

# A restore checks it has room for the staged dump plus the restored database, twice over. The
# database's size is recorded on each dump this tooling makes. For a dump without it (a hand-made
# seed), assume the database is this many times the size of the compressed dump.
RESTORE_SIZE_FACTOR=5

# The app credentials are published to SSM (the name comes from ../common/db-credentials-path.sh
# <ENV>) as a SecureString encrypted with this KMS key. Blank means the AWS-managed key aws/ssm.
SSM_KMS_KEY_ID=""

# Each AWS call that publishes or reads the credentials is tried up to AWS_ATTEMPTS times,
# waiting AWS_RETRY_SLEEP_SECONDS x attempt between tries.
AWS_ATTEMPTS=4
AWS_RETRY_SLEEP_SECONDS=5

# Where the container mounts its config volume, hpds-etl-participant-db-<ENV>-conf. The volume
# holds the TLS certificate and key, the superuser password file and pg_hba.conf.
PDB_CONF_DIR=/etc/pdb
