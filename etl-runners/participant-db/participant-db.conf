# Settings for the participant database container on the Jenkins host. Sourced by lib.sh.
# Per-environment network settings (participant_db_host) live in ../environments/<ENV>.tfvars.

# The server must run this major version. start.sh replaces a container on any other.
PG_MAJOR=16
PG_IMAGE=docker.io/library/postgres:16

DB_NAME=etl_db
DB_USERNAME=hpds_etl
DB_SCHEMA=etl
DB_PORT=5432
MAX_CONNECTIONS=300
SHARED_BUFFERS=1GB

# Dumps: s3://<BACKUP_BUCKET>/<BACKUP_PREFIX>/<ENV>/backups/ (bucket must be versioned).
BACKUP_BUCKET=bdc-etl-data-d0d6191
BACKUP_PREFIX=avillach-73-bdcatalyst-etl/participant-db

# pg_dump / pg_restore parallelism inside the container.
DUMP_JOBS=4

# How long to wait for Postgres to accept connections after (re)creating the container.
READY_TIMEOUT_SECONDS=300

# How long start.sh waits for a stopped container to come back so it can be saved first.
RESTART_STOPPED_TIMEOUT_SECONDS=120
