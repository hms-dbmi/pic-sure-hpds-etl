# Runs the unit and Testcontainers integration suites (`./mvnw verify`) for one commit.
#
# Started by etl-runners/integration-tests/run-codebuild.sh against the project defined in
# etl-runners/integration-tests/terraform (privileged, so the build has a Docker daemon for
# Testcontainers). The source is a `git archive` of the commit, so this file ships with it.
version: 0.2

env:
  variables:
    # The managed images carry older JDKs; the pom targets 25.
    JDK_URL: https://corretto.aws/downloads/latest/amazon-corretto-25-x64-linux-jdk.tar.gz
    JDK_HOME: /opt/corretto-25

phases:
  install:
    commands:
      - mkdir -p "$JDK_HOME"
      - curl -fsSL "$JDK_URL" | tar -xz -C "$JDK_HOME" --strip-components=1
      - '"$JDK_HOME/bin/java" -version'
      - docker info --format 'Docker {{.ServerVersion}}'
  build:
    commands:
      # A zip extraction does not reliably keep the executable bit.
      - chmod +x mvnw
      - JAVA_HOME="$JDK_HOME" PATH="$JDK_HOME/bin:$PATH" ./mvnw -B verify

# Uploaded even when the build phase fails, so Jenkins can show which tests failed.
artifacts:
  files:
    - target/surefire-reports/**/*
    - target/failsafe-reports/**/*

cache:
  paths:
    - /root/.m2/**/*
